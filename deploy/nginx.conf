# Include inside nginx's http{} configuration (e.g. conf.d/studio.conf).
# Copy all of dist/, including .gz/.br sidecars, to this root.
server {
    listen 80;
    server_name _;
    root /srv/studio/dist;
    index index.html;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Requires ngx_http_gzip_static_module. No per-request recompression.
    gzip_static on;
    gzip_vary on;
    # Enable only when ngx_brotli's static module is installed/loaded:
    # brotli_static on;

    # Missing game/compiled assets must return 404 rather than SPA HTML.
    location /game/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
